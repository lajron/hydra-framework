schema: "hydra-framework.knowledge-node.v1"
node: "hydra-framework"
hydra_id: "hydra://knowledge-space/hydra-framework"
uid: "d732d9ce-e807-4858-8888-8f541e6c486b"
schema_version: 3
kind: "knowledge-space"
title: "Hydra Framework Itself"
status: "active"
scope: "base-seed"
owners:
  team: "hydra"
relations: []
provenance:
  sources: []
role: "accountability-root"
routable: true
state: "./state.md"
overview: "./overview.md"
keywords:
  - "hydra"
  - "adapter"
  - "export-adapters"
  - "subagent"
  - "capability map"
  - "capability class"
  - "effort budget"
  - "placement rule"
  - "knowledge space"
  - "seed reconciliation"
  - "diff-base"
  - "reclaim"
  - "task record"
  - "checkpoint"
  - "provider surface"
defaults: {}
routes:
  add_module:
    use_when:
      - "adding or changing a Hydra skill subagent or slash command"
    priority_units:
      - "hydra://knowledge-unit/hydra-framework/add-module"
    requires: []
    avoid_by_default:
      - "generated files under .claude/, .agents/, or .codex/"
      - "project-wiki/"
    verify:
      - "python3 .hydra-framework/scripts/hydra.py export-adapters --check"
    expand_when: []
  adopt_into_repo:
    use_when:
      - "Hydra was copied into a repository and needs wiring"
    priority_units:
      - "hydra://knowledge-unit/hydra-framework/adopt-into-repo"
    requires: []
    avoid_by_default:
      - "the host repository's full source tree"
    verify:
      - "python3 .hydra-framework/scripts/hydra.py adopt"
    expand_when: []
  change_task_contract:
    use_when:
      - "adding renaming or removing a required task record field"
    priority_units:
      - "hydra://knowledge-unit/hydra-framework/change-task-contract"
    requires: []
    avoid_by_default:
      - "archived and completed task records"
    verify:
      - "python3 .hydra-framework/scripts/hydra.py validate"
    expand_when: []
  fix_provider_surface:
    use_when:
      - "reclaim or the post-edit hook reports an orphaned drifted or stale provider file"
    priority_units:
      - "hydra://knowledge-unit/hydra-framework/fix-provider-surface"
    requires: []
    avoid_by_default: []
    verify:
      - "python3 .hydra-framework/scripts/hydra.py reclaim"
      - "python3 .hydra-framework/scripts/hydra.py export-adapters --check"
    expand_when: []
  reconcile_with_base:
    use_when:
      - "comparing a diverged Hydra copy against its base seed"
    priority_units:
      - "hydra://knowledge-unit/hydra-framework/reconcile-with-base"
    requires: []
    avoid_by_default:
      - "tasks/ and cognition/ on either side"
    verify: []
    expand_when: []
